$kind: http-request
name: 1.2 استعراض تفاصيل ملف معلم محدد (Get Teacher By ID)
description: |-
  استرجاع الملف الشخصي الكامل لمعلم محدد متضمناً حساب دخوله الموحد وبياناته المهنية.
url: "{{baseUrl}}/teachers/{{teacherId}}"
method: GET
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{authToken}}"
responses:
  - name: 200 OK - تم جلب تفاصيل ملف المعلم بنجاح
    status: OK
    code: 200
    headers:
      Content-Type: application/json
    body:
      success: true
      message: "تم جلب تفاصيل ملف المعلم بنجاح."
      data:
        id: 1
        user_id: 10
        user_code: "TCH-2001"
        full_name: "أحمد محمود سالم"
        phone: "0912345678"
        specialization: "الرياضيات"
        hire_date: "2022-09-01"
        is_active: 1
        created_at: "2022-09-01T10:00:00Z"
  - name: 404 Not Found - ملف المعلم غير موجود
    status: Not Found
    code: 404
    headers:
      Content-Type: application/json
    body:
      success: false
      message: "ملف المعلم غير موجود."
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 or 404", function () {
          pm.expect([200, 404]).to.include(pm.response.code);
      });

      if (pm.response.code === 200) {
          var jsonData = pm.response.json();
          pm.test("Teacher profile details schema is valid", function () {
              pm.expect(jsonData.success).to.eql(true);
              pm.expect(jsonData.data).to.be.an('object');
              pm.expect(jsonData.data.id).to.be.a('number');
              pm.expect(jsonData.data.user_code).to.be.a('string');
              pm.expect(jsonData.data.full_name).to.be.a('string');
          });
      }
    language: text/javascript
order: 2000
