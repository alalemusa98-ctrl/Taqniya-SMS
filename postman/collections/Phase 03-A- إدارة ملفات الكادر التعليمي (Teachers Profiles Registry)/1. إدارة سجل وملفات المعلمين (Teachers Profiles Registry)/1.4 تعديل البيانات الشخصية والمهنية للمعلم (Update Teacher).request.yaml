$kind: http-request
name: 1.4 تعديل البيانات الشخصية والمهنية للمعلم (Update Teacher)
description: |-
  تحديث بيانات ملف المعلم (الاسم، الهاتف، التخصص، تاريخ التعيين، أو كلمة المرور) مع حماية البريد والهاتف ضد التكرار.
url: "{{baseUrl}}/teachers/{{createdTeacherId}}"
method: PUT
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: text
  content: |-
    {
      "full_name": "علي مصطفى الورفلي المحدث",
      "phone": "0934567890",
      "specialization": "اللغة العربية والتربية الإسلامية",
      "hire_date": "2026-09-01"
    }
auth:
  type: bearer
  credentials:
    token: "{{authToken}}"
responses:
  - name: 200 OK - تم تحديث بيانات ملف المعلم بنجاح
    status: OK
    code: 200
    headers:
      Content-Type: application/json
    body:
      success: true
      message: "تم تحديث بيانات ملف المعلم بنجاح."
      data:
        id: 3
        user_id: 12
        user_code: "TCH-2003"
        full_name: "علي مصطفى الورفلي المحدث"
        phone: "0934567890"
        specialization: "اللغة العربية والتربية الإسلامية"
        hire_date: "2026-09-01"
  - name: 404 Not Found - ملف المعلم غير موجود
    status: Not Found
    code: 404
    headers:
      Content-Type: application/json
    body:
      success: false
      message: "ملف المعلم غير موجود."
  - name: 409 Conflict - رقم هاتف المعلم مسجل مسبقاً
    status: Conflict
    code: 409
    headers:
      Content-Type: application/json
    body:
      success: false
      message: "رقم هاتف المعلم مسجل مسبقاً."
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200, 404 or 409", function () {
          pm.expect([200, 404, 409]).to.include(pm.response.code);
      });

      if (pm.response.code === 200) {
          var jsonData = pm.response.json();
          pm.test("Teacher update reflects updated fields", function () {
              pm.expect(jsonData.success).to.eql(true);
              pm.expect(jsonData.data.full_name).to.eql("علي مصطفى الورفلي المحدث");
              pm.expect(jsonData.data.specialization).to.eql("اللغة العربية والتربية الإسلامية");
          });
      }
    language: text/javascript
order: 4000
