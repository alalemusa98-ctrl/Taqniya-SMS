$kind: http-request
name: 1.3 إنشاء ملف معلم جديد وتوليد الحساب الموحد (Create Teacher)
description: |-
  إنشاء ملف المعلم وتوليد حساب الدخول الموحد (TCH-XXXX) في جدول المستخدمين users ذرياً ضمن نفس المعاملة.
url: "{{baseUrl}}/teachers"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: text
  content: |-
    {
      "full_name": "علي مصطفى الورفلي",
      "phone": "0934567890",
      "specialization": "اللغة العربية",
      "hire_date": "2026-09-01",
      "password": "Password123!"
    }
auth:
  type: bearer
  credentials:
    token: "{{authToken}}"
responses:
  - name: 201 Created - تم إنشاء ملف المعلم وتوليد حساب الدخول الموحد بنجاح
    status: Created
    code: 201
    headers:
      Content-Type: application/json
    body:
      success: true
      message: "تم إنشاء ملف المعلم وتوليد حساب الدخول الموحد بنجاح."
      data:
        id: 3
        user_id: 12
        user_code: "TCH-2003"
        full_name: "علي مصطفى الورفلي"
        phone: "0934567890"
        specialization: "اللغة العربية"
        hire_date: "2026-09-01"
        created_at: "2026-08-29T12:00:00Z"
  - name: 409 Conflict - رقم هاتف المعلم مسجل مسبقاً
    status: Conflict
    code: 409
    headers:
      Content-Type: application/json
    body:
      success: false
      message: "رقم هاتف المعلم مسجل مسبقاً."
  - name: 422 Unprocessable Entity - بيانات غير صالحة
    status: Unprocessable Entity
    code: 422
    headers:
      Content-Type: application/json
    body:
      success: false
      message: "بيانات ملف المعلم غير صالحة."
      errors:
        full_name:
          - "الاسم الرباعي واللقب للمعلم مطلوب."
        password:
          - "كلمة المرور يجب ألا تقل عن 8 خانات وتحتوي على أرقام وحروف."
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 201 or 409", function () {
          pm.expect([201, 409]).to.include(pm.response.code);
      });

      var jsonData = pm.response.json();
      if (pm.response.code === 201) {
          pm.test("Teacher created with valid atomic user code TCH-XXXX", function () {
              pm.expect(jsonData.success).to.eql(true);
              pm.expect(jsonData.data.id).to.be.a('number');
              pm.expect(jsonData.data.user_code).to.match(/^TCH-\d+$/);
          });

          if (jsonData.data && jsonData.data.id) {
              pm.environment.set("createdTeacherId", String(jsonData.data.id));
              console.log("✅ تم حفظ createdTeacherId بنجاح:", jsonData.data.id);
          }
      } else if (pm.response.code === 409) {
          pm.test("Conflict detected on phone number duplicate", function () {
              pm.expect(jsonData.success).to.eql(false);
          });
      }
    language: text/javascript
order: 3000
