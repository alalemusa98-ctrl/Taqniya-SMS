$kind: http-request
name: 1.4 تعديل إسناد التدريس أو تغيير المعلم والمادة للشعبة (Update Teaching Assignment)
description: |-
  تحديث وتعديل سجل الإسناد (تغيير المعلم المكلف أو الشعبة أو المادة) مع التحقق من عدم التعارض وفق routes.md.
url: "{{baseUrl}}/teaching-assignments/{{teachingAssignmentId}}"
method: PUT
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: text
  content: |-
    {
      "academic_year_id": 1,
      "class_section_id": 5,
      "subject_id": 1,
      "teacher_id": 3
    }
auth:
  type: bearer
  credentials:
    token: "{{authToken}}"
responses:
  - name: 200 OK - تم تحديث وتعديل إسناد التدريس بنجاح
    status: OK
    code: 200
    headers:
      Content-Type: application/json
    body:
      success: true
      message: "تم تحديث وتعديل إسناد التدريس بنجاح."
      data:
        id: 101
        academic_year_id: 1
        class_section_id: 5
        subject_id: 1
        teacher_id: 3
  - name: 404 Not Found - سجل إسناد التدريس غير موجود
    status: Not Found
    code: 404
    headers:
      Content-Type: application/json
    body:
      success: false
      message: "سجل إسناد التدريس غير موجود."
  - name: 409 Conflict - تعارض في الإسناد (قيد المعلم المسؤول الوحيد)
    status: Conflict
    code: 409
    headers:
      Content-Type: application/json
    body:
      success: false
      message: "تعارض في الإسناد: هذه المادة مسندة بالفعل لمعلم آخر في هذه الشعبة خلال العام الدراسي الحالي (uq_teaching_assignment)."
  - name: 422 Unprocessable Entity - بيانات إسناد التدريس غير صالحة
    status: Unprocessable Entity
    code: 422
    headers:
      Content-Type: application/json
    body:
      success: false
      message: "بيانات إسناد التدريس غير صالحة."
      errors:
        teacher_id:
          - "المعلم المختار غير نشط أو غير موجود."
        class_section_id:
          - "الشعبة المحددة غير صالحة."
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200, 404, or 409", function () {
          pm.expect([200, 404, 409]).to.include(pm.response.code);
      });

      var jsonData = pm.response.json();
      if (pm.response.code === 200) {
          pm.test("Teaching assignment updated successfully", function () {
              pm.expect(jsonData.success).to.eql(true);
          });
      }
    language: text/javascript
order: 4000
