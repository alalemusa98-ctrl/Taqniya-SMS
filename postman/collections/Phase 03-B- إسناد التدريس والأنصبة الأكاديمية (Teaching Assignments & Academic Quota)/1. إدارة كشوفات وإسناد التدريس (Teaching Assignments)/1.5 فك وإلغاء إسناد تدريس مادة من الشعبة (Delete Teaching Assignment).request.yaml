$kind: http-request
name: 1.5 فك وإلغاء إسناد تدريس مادة من الشعبة (Delete Teaching Assignment)
description: |-
  فك ارتباط المعلم بالمادة والشعبة، مع التحقق الإجباري الصارم من عدم وجود ارتباطات بحصص أو درجات أو واجبات (RESTRICT).
url: "{{baseUrl}}/teaching-assignments/{{createdAssignmentId}}"
method: DELETE
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{authToken}}"
responses:
  - name: 200 OK - تم فك وإلغاء إسناد التدريس بنجاح
    status: OK
    code: 200
    headers:
      Content-Type: application/json
    body:
      success: true
      message: "تم فك وإلغاء إسناد التدريس بنجاح."
  - name: 404 Not Found - سجل إسناد التدريس غير موجود
    status: Not Found
    code: 404
    headers:
      Content-Type: application/json
    body:
      success: false
      message: "سجل إسناد التدريس غير موجود."
  - name: 409 Conflict - حماية النزاهة المرجعية RESTRICT
    status: Conflict
    code: 409
    headers:
      Content-Type: application/json
    body:
      success: false
      message: "لا يمكن فك إسناد التدريس لوجود ارتباطات قائمة بجدول الحصص أو الدرجات المسجلة للطلاب."
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200, 404, or 409", function () {
          pm.expect([200, 404, 409]).to.include(pm.response.code);
      });

      var jsonData = pm.response.json();
      if (pm.response.code === 200) {
          pm.test("Assignment deleted successfully", function () {
              pm.expect(jsonData.success).to.eql(true);
          });
      }
    language: text/javascript
order: 5000
