$kind: http-request
name: 1.1 استعراض وبحث توزيع الكادر التعليمي على المواد والشعب (List Teaching Assignments)
description: |-
  استرجاع خريطة توزيع الكادر التعليمي على المواد والشعب بالعام الدراسي مجمعة هرمياً لكل صف وشعبة (classes -> sections -> assignments) بدون تكرار للبيانات مع دعم التصفية والترقيم القياسي.
url: "{{baseUrl}}/teaching-assignments?search=&academic_year_id=&class_id=&class_section_id=&teacher_id=&subject_id=&page=1&per_page=15"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: search
    value: ""
    disabled: true
    description: البحث النصي باسم المعلم أو الصف أو الشعبة أو المادة
  - key: academic_year_id
    value: ""
    disabled: true
    description: تصفية حسب العام الدراسي (افتراضياً العام النشط)
  - key: class_id
    value: ""
    disabled: true
    description: تصفية لجلب شعب ومواد صف دراسي محدد
  - key: class_section_id
    value: ""
    disabled: true
    description: تصفية لجلب مواد شعبة دراسية محددة فقط
  - key: teacher_id
    value: ""
    disabled: true
    description: تصفية حسب معلم محدد
  - key: subject_id
    value: ""
    disabled: true
    description: تصفية حسب المادة التعليمية
  - key: page
    value: "1"
    description: رقم الصفحة
  - key: per_page
    value: "15"
    description: عدد السجلات في الصفحة
auth:
  type: bearer
  credentials:
    token: "{{authToken}}"
responses:
  - name: 200 OK - نجاح جلب توزيع الكادر التعليمي
    status: OK
    code: 200
    headers:
      Content-Type: application/json
    body:
      success: true
      message: "تم جلب توزيع الكادر التعليمي على المواد والشعب بنجاح."
      data:
        academic_year_id: 1
        academic_year_name: "2025/2026"
        classes:
          - class_id: 1
            class_name: "الصف الأول الابتدائي"
            sections:
              - class_section_id: 1
                section_name: "أ"
                assignments:
                  - id: 1
                    teacher_id: 1
                    teacher_name: "أحمد محمود سالم"
                    teacher_user_code: "TCH-2001"
                    subject_id: 1
                    subject_name: "الرياضيات"
                    weekly_classes_count: 4
      meta:
        current_page: 1
        per_page: 15
        total: 1
        last_page: 1
  - name: 401 Unauthorized - غير مصرح بالوصول
    status: Unauthorized
    code: 401
    headers:
      Content-Type: application/json
    body:
      success: false
      message: "غير مصرح بالوصول. التوكن غير صالح أو منتهي الصلاحية."
  - name: 403 Forbidden - صلاحيات غير كافية
    status: Forbidden
    code: 403
    headers:
      Content-Type: application/json
    body:
      success: false
      message: "ليس لديك الصلاحية الكافية لتنفيذ هذا الإجراء."
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 - نجاح جلب التوزيع الأكاديمي", function () {
          pm.response.to.have.status(200);
      });

      var jsonData = pm.response.json();
      pm.test("Response has valid teaching assignments hierarchical structure", function () {
          pm.expect(jsonData.success).to.eql(true);
          pm.expect(jsonData.data).to.be.an('object');
          pm.expect(jsonData.data.classes).to.be.an('array');
      });

      if (jsonData.data && jsonData.data.classes && jsonData.data.classes.length > 0) {
          var firstClass = jsonData.data.classes[0];
          if (firstClass.sections && firstClass.sections.length > 0) {
              var firstSection = firstClass.sections[0];
              if (firstSection.assignments && firstSection.assignments.length > 0) {
                  pm.environment.set("teachingAssignmentId", String(firstSection.assignments[0].id));
                  console.log("✅ تم استخراج teachingAssignmentId للاختبار:", firstSection.assignments[0].id);
              }
          }
      }
    language: text/javascript
order: 1000
