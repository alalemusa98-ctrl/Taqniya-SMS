$kind: http-request
name: 1.3 إسناد وتكليف معلم بتدريس مادة لشعبة (Assign Teacher To Subject)
description: |-
  تكليف معلم مسؤول عن تدريس مادة معينة لشعبة في عام دراسي محدد وفق مواصفات routes.md مع فرض قيد المعلم المسؤول الوحيد uq_teaching_assignment.
url: "{{baseUrl}}/teaching-assignments"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: text
  content: |-
    {
      "academic_year_id": 1,
      "class_section_id": 5,
      "subject_id": 1,
      "teacher_id": 1
    }
auth:
  type: bearer
  credentials:
    token: "{{authToken}}"
responses:
  - name: 201 Created - تم إسناد تدريس المادة للمعلم بنجاح
    status: Created
    code: 201
    headers:
      Content-Type: application/json
    body:
      success: true
      message: "تم إسناد تدريس المادة للمعلم بنجاح."
      data:
        id: 101
        academic_year_id: 1
        class_section_id: 5
        subject_id: 1
        teacher_id: 1
        created_at: "2026-08-29T12:00:00Z"
  - name: 409 Conflict - تعارض في الإسناد (قيد المعلم المسؤول الوحيد)
    status: Conflict
    code: 409
    headers:
      Content-Type: application/json
    body:
      success: false
      message: "تعارض في الإسناد: هذه المادة مسندة بالفعل لمعلم آخر في هذه الشعبة خلال العام الدراسي الحالي (uq_teaching_assignment)."
  - name: 422 Unprocessable Entity - بيانات إسناد التدريس غير صالحة
    status: Unprocessable Entity
    code: 422
    headers:
      Content-Type: application/json
    body:
      success: false
      message: "بيانات إسناد التدريس غير صالحة."
      errors:
        teacher_id:
          - "المعلم المختار غير نشط أو غير موجود."
        class_section_id:
          - "الشعبة المحددة غير صالحة."
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 201 or 409", function () {
          pm.expect([201, 409]).to.include(pm.response.code);
      });

      var jsonData = pm.response.json();
      if (pm.response.code === 201) {
          pm.test("Teaching assignment created successfully with routes.md schema", function () {
              pm.expect(jsonData.success).to.eql(true);
              pm.expect(jsonData.data.id).to.be.a('number');
          });

          if (jsonData.data && jsonData.data.id) {
              pm.environment.set("createdAssignmentId", String(jsonData.data.id));
              console.log("✅ تم حفظ createdAssignmentId:", jsonData.data.id);
          }
      } else if (pm.response.code === 409) {
          pm.test("Conflict on duplicate assignment caught properly", function () {
              pm.expect(jsonData.success).to.eql(false);
          });
      }
    language: text/javascript
order: 3000
