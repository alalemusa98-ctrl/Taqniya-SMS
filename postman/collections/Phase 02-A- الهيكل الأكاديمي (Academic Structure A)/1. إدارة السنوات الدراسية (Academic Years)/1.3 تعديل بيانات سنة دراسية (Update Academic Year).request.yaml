$kind: http-request
name: 1.3 تعديل بيانات سنة دراسية (Update Academic Year)
description: |-
  تحديث بيانات سنة دراسية قائمة بالمعرف `{{yearId}}`.
url: "{{baseUrl}}/academic/years/{{yearId}}"
method: PUT
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: text
  content: |-
    {
      "name": "2029/2030 (معدلة)",
      "start_date": "2029-09-01",
      "end_date": "2030-06-30"
    }
auth:
  type: bearer
  credentials:
    token: "{{authToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 - تم تحديث السنة الدراسية بنجاح", function () {
          pm.response.to.have.status(200);
      });

      var jsonData = pm.response.json();
      pm.test("Updated year response has correct updated data", function () {
          pm.expect(jsonData.success).to.eql(true);
          pm.expect(jsonData.data.name).to.eql("2029/2030 (معدلة)");
      });
    language: text/javascript
order: 3000
