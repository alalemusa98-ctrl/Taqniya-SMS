$kind: http-request
name: 2.3 تعديل مسمى أو ترتيب فترة بالكتالوج (Update Academic Term)
description: |-
  تحديث بيانات فترة مرجعية قائمة بالكتالوج بالمعرف `{{termId}}`.
url: "{{baseUrl}}/academic/terms/{{termId}}"
method: PUT
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: text
  content: |-
    {
      "name": "الفصل الصيفي المكثف (معدل)",
      "term_number": 9
    }
auth:
  type: bearer
  credentials:
    token: "{{authToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 - تم تحديث الفترة بنجاح", function () {
          pm.response.to.have.status(200);
      });

      var jsonData = pm.response.json();
      pm.test("Updated term has modified name", function () {
          pm.expect(jsonData.success).to.eql(true);
          pm.expect(jsonData.data.name).to.eql("الفصل الصيفي المكثف (معدل)");
      });
    language: text/javascript
order: 3000
