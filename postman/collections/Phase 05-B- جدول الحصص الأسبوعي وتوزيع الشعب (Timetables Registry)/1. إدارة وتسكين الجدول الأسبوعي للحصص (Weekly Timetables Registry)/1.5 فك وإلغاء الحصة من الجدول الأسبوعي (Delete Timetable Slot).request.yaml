$kind: http-request
name: 1.5 فك وإلغاء الحصة من الجدول الأسبوعي (Delete Timetable Slot)
description: |-
  فك الحصة الدراسية وإفراغ الموعد بالجدول الأسبوعي للشعبة والمعلم نهائياً وفق routes.md.
url: "{{baseUrl}}/timetables/slots/{{createdTimetableSlotId}}"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: createdTimetableSlotId
    value: "{{createdTimetableSlotId}}"
    description: معرّف الحصة الأسبوعية المراد فكها وحذفها من الجدول
auth:
  type: bearer
  credentials:
    token: "{{authToken}}"
responses:
  - name: 200 OK - تم حذف وإلغاء الحصة بنجاح
    status: OK
    code: 200
    headers:
      Content-Type: application/json
    body:
      success: true
      message: "تم حذف وإلغاء الحصة من الجدول الأسبوعي بنجاح."
  - name: 404 Not Found - الحصة غير موجودة
    status: Not Found
    code: 404
    headers:
      Content-Type: application/json
    body:
      success: false
      message: "الحصة غير موجودة بالجدول الأسبوعي."
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 OK - تم حذف الحصة بنجاح", function () {
          pm.expect([200, 404]).to.include(pm.response.code);
      });

      if (pm.response.code === 200) {
          var res = pm.response.json();
          pm.test("Success property is true", function () {
              pm.expect(res.success).to.eql(true);
          });
      }
    language: text/javascript
order: 5000
