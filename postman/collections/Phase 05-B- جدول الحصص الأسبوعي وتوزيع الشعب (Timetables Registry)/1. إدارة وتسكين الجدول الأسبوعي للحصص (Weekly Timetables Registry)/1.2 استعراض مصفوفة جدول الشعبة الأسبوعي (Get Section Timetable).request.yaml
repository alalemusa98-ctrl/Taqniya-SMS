$kind: http-request
name: 1.2 استعراض مصفوفة جدول الشعبة الأسبوعي (Get Section Timetable)
description: |-
  استرجاع مصفوفة الحصص الأسبوعية الموزعة حسب أيام الأسبوع (من الأحد إلى الخميس) لشعبة دراسية محددة وفق routes.md.
url: "{{baseUrl}}/timetables/sections/{{testClassSectionId}}?academic_year_id={{academicYearId}}"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: testClassSectionId
    value: "{{testClassSectionId}}"
    description: معرّف الشعبة الدراسية المستهدفة
queryParams:
  - key: academic_year_id
    value: "{{academicYearId}}"
    description: معرّف العام الدراسي (اختياري - يستخدم العام النشط في حال الإغفال)
auth:
  type: bearer
  credentials:
    token: "{{authToken}}"
responses:
  - name: 200 OK - تم جلب جدول الشعبة بنجاح
    status: OK
    code: 200
    headers:
      Content-Type: application/json
    body:
      success: true
      message: "تم جلب جدول الشعبة بنجاح."
      data:
        - day_of_week: "sunday"
          slots:
            - id: 1
              period_slot_id: 1
              teaching_assignment_id: 1
              period_name: "الحصة الأولى"
              slot_number: 1
              start_time: "08:00:00"
              end_time: "08:45:00"
              subject_name: "الرياضيات"
              teacher_name: "أحمد بن عبد الله"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 - تم جلب جدول الشعبة الأسبوعي", function () {
          pm.response.to.have.status(200);
      });

      if (pm.response.code === 200) {
          var res = pm.response.json();
          pm.test("Timetable days array is returned", function () {
              pm.expect(res.success).to.eql(true);
              pm.expect(res.data).to.be.an('array');
          });
      }
    language: text/javascript
order: 2000
