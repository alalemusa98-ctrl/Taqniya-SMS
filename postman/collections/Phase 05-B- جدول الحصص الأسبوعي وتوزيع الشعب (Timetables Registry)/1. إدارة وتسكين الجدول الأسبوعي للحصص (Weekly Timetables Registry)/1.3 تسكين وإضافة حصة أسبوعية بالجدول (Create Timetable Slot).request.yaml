$kind: http-request
name: 1.3 تسكين وإضافة حصة أسبوعية بالجدول (Create Timetable Slot)
description: |-
  إضافة وتسكين حصة جديدة في الجدول الأسبوعي لشعبة محددة، مع التحقق الإجباري من عدم تعارض جدول الشعبة والمعلم (BR-TT-01 و BR-TT-02) وصلاحية التكليف وفترة الحصة، مع إرجاع 422 في حال عدم صحة المدخلات.
url: "{{baseUrl}}/timetables/slots"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: text
  content: |-
    {
      "academic_year_id": {{academicYearId}},
      "class_section_id": {{testClassSectionId}},
      "day_of_week": "sunday",
      "period_slot_id": 1,
      "teaching_assignment_id": 1
    }
auth:
  type: bearer
  credentials:
    token: "{{authToken}}"
responses:
  - name: 201 Created - تم إضافة وتسكين الحصة بالجدول بنجاح
    status: Created
    code: 201
    headers:
      Content-Type: application/json
    body:
      success: true
      message: "تم إضافة وتسكين الحصة بالجدول الأسبوعي بنجاح."
      data:
        id: 10
        academic_year_id: 1
        class_section_id: 1
        day_of_week: "sunday"
        period_slot_id: 1
        teaching_assignment_id: 1
        created_at: "2026-08-29T10:00:00Z"
  - name: 409 Conflict - تعارض في الجدول للشعبة أو المعلم
    status: Conflict
    code: 409
    headers:
      Content-Type: application/json
    body:
      success: false
      message: "تعارض في الجدول: الشعبة الدراسية مرتبطة بالفعل بحصة أخرى في نفس اليوم والتوقيت."
  - name: 422 Unprocessable Entity - مدخلات غير صالحة
    status: Unprocessable Entity
    code: 422
    headers:
      Content-Type: application/json
    body:
      success: false
      message: "بيانات تسكين الحصة غير صالحة."
      errors:
        day_of_week:
          - "day_of_week must be one of the following values: sunday, monday, tuesday, wednesday, thursday"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 201 Created or 409 Conflict (Handled)", function () {
          pm.expect([201, 409]).to.include(pm.response.code);
      });

      if (pm.response.code === 201) {
          var res = pm.response.json();
          pm.test("Slot created with valid ID", function () {
              pm.expect(res.success).to.eql(true);
              pm.expect(res.data.id).to.be.a('number');
          });
          pm.environment.set("createdTimetableSlotId", res.data.id);
          console.log("✅ تم حفظ createdTimetableSlotId: " + res.data.id);
      }
    language: text/javascript
order: 3000
