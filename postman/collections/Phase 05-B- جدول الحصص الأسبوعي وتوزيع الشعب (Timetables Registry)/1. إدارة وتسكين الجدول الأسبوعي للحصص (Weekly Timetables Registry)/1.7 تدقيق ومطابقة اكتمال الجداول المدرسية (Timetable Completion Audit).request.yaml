$kind: http-request
name: 1.7 تدقيق ومطابقة اكتمال الجداول المدرسية (Timetable Completion Audit)
description: |-
  تدقيق شامل ومقارنة بين الحصص المطلوبة وفق خطة المنهج الدراسي والحصص المسكنة فعلياً في الجدول لكل شعبة، وإرجاع نواقص التسكين والشواغر وفق routes.md.
url: "{{baseUrl}}/timetables/completion-audit?academic_year_id={{academicYearId}}"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: academic_year_id
    value: "{{academicYearId}}"
    description: معرّف العام الدراسي (اختياري - يستخدم العام النشط في حال الإغفال)
auth:
  type: bearer
  credentials:
    token: "{{authToken}}"
responses:
  - name: 200 OK - تم فحص وتدقيق اكتمال تسكين الجداول بنجاح
    status: OK
    code: 200
    headers:
      Content-Type: application/json
    body:
      success: true
      message: "تم فحص وتدقيق اكتمال تسكين الجداول بنجاح."
      data:
        total_unscheduled_slots: 4
        classes:
          - class_id: 1
            class_name: "الصف الأول الابتدائي"
            total_unscheduled_slots: 2
            is_fully_scheduled: false
            sections:
              - class_section_id: 1
                section_name: "الشعبة أ"
                required_slots_count: 30
                scheduled_slots_count: 28
                unscheduled_slots_count: 2
                is_fully_scheduled: false
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 OK - تم تدقيق اكتمال الجداول", function () {
          pm.response.to.have.status(200);
      });

      if (pm.response.code === 200) {
          var res = pm.response.json();
          pm.test("Audit response contains total_unscheduled_slots and classes", function () {
              pm.expect(res.success).to.eql(true);
              pm.expect(res.data).to.have.property('total_unscheduled_slots');
              pm.expect(res.data.classes).to.be.an('array');
          });
      }
    language: text/javascript
order: 7000
