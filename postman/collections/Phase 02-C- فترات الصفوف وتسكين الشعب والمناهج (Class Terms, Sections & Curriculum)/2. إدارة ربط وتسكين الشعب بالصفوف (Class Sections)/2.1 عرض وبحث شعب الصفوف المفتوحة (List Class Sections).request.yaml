$kind: http-request
name: 2.1 عرض وبحث شعب الصفوف المفتوحة (List Class Sections)
description: |-
  استرجاع قائمة الشعب المفتوحة والمسندة لكافة الصفوف الدراسية مجمعة هرمياً مع إمكانية الفلترة لصف محدد والبحث النصي والترقيم.
url: "{{baseUrl}}/academic/class-sections?class_id=&search=&page=1&per_page=15"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: class_id
    value: ""
    disabled: true
    description: فلترة الشعب لصف معين فقط (مثال 5)
  - key: search
    value: ""
    disabled: true
    description: البحث النصي باسم الشعبة أو الصف
  - key: page
    value: "1"
    description: رقم الصفحة
  - key: per_page
    value: "15"
    description: عدد السجلات في الصفحة
auth:
  type: bearer
  credentials:
    token: "{{authToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 - نجاح جلب شعب الصفوف الدراسية", function () {
          pm.response.to.have.status(200);
      });

      var jsonData = pm.response.json();
      pm.test("Response contains structured classes and sections schema", function () {
          pm.expect(jsonData.success).to.eql(true);
          pm.expect(jsonData.data).to.be.an('object');
          pm.expect(jsonData.data.classes).to.be.an('array');
          pm.expect(jsonData.meta).to.be.an('object');
          pm.expect(jsonData.meta.current_page).to.be.a('number');
      });

      if (jsonData.data && jsonData.data.classes.length > 0) {
          for (var i = 0; i < jsonData.data.classes.length; i++) {
              var c = jsonData.data.classes[i];
              if (c.sections && c.sections.length > 0) {
                  pm.environment.set("testClassSectionId", c.sections[0].id);
                  break;
              }
          }
      }
    language: text/javascript
order: 1000
