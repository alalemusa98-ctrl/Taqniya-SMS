$kind: http-request
name: 2.3 فك ربط شعبة من صف دراسي (Delete Class Section)
description: |-
  إلغاء تسكين شعبة من صف دراسي بشرط عدم وجود طلاب مسجلين بها في هذا العام أو معلمين مسندين (ON DELETE RESTRICT -> 409 Conflict).
url: "{{baseUrl}}/academic/class-sections/{{testClassSectionId}}"
method: DELETE
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{authToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 OK or 409 Conflict (RESTRICT)", function () {
          pm.expect([200, 404, 409]).to.include(pm.response.code);
      });

      if (pm.response.code === 200) {
          var jsonData = pm.response.json();
          pm.test("Response confirms class section unassignment", function () {
              pm.expect(jsonData.success).to.eql(true);
          });
      }
    language: text/javascript
order: 3000
