$kind: http-request
name: 1.2 تخصيص وربط فترة بصف دراسي (Assign Class Academic Term)
description: |-
  تخصيص وربط فترة رسمية لصف دراسي في القالب العام بحالة افتراضية (is_active = 0, is_closed = 0) مع فحص عدم التكرار (uq_class_term).
url: "{{baseUrl}}/academic/class-academic-terms"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: text
  content: |-
    {
      "class_id": {{testClassId}},
      "academic_term_id": 1
    }
auth:
  type: bearer
  credentials:
    token: "{{authToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 201 Created or 409 Conflict", function () {
          pm.expect([201, 409]).to.include(pm.response.code);
      });

      var jsonData = pm.response.json();
      if (pm.response.code === 201) {
          pm.test("Response contains assigned class term details", function () {
              pm.expect(jsonData.success).to.eql(true);
              pm.expect(jsonData.data.id).to.be.a('number');
              pm.expect(jsonData.data.is_active).to.eql(0);
              pm.expect(jsonData.data.is_closed).to.eql(0);
          });
          pm.environment.set("testClassTermId", jsonData.data.id);
      }
    language: text/javascript
order: 2000
