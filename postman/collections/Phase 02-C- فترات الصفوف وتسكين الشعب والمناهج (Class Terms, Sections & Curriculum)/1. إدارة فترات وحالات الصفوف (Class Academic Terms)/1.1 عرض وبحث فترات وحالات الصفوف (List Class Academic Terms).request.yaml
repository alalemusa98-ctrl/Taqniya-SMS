$kind: http-request
name: 1.1 عرض وبحث فترات وحالات الصفوف (List Class Academic Terms)
description: |-
  استرجاع فترات وحالات كافة صفوف المدرسة مجمعة هرمياً لكل صف مع دعم الفلترة لصف محدد أو فترة محددة أو البحث النصي والترقيم القياسي.
url: "{{baseUrl}}/academic/class-academic-terms?class_id=&academic_term_id=&is_active=&is_closed=&search=&page=1&per_page=15"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: class_id
    value: ""
    disabled: true
    description: فلترة لصف دراسي محدد (مثال 9)
  - key: academic_term_id
    value: ""
    disabled: true
    description: فلترة بحسب الفترة المرجعية
  - key: is_active
    value: ""
    disabled: true
    description: فلترة بحسب الفترة النشطة حالياً (0 أو 1)
  - key: is_closed
    value: ""
    disabled: true
    description: فلترة بحسب حالة إغلاق الدرجات (0 أو 1)
  - key: search
    value: ""
    disabled: true
    description: البحث النصي بمسمى الصف أو الفترة
  - key: page
    value: "1"
    description: رقم الصفحة
  - key: per_page
    value: "15"
    description: عدد السجلات في الصفحة
auth:
  type: bearer
  credentials:
    token: "{{authToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 - نجاح جلب فترات وحالات صفوف المدرسة", function () {
          pm.response.to.have.status(200);
      });

      var jsonData = pm.response.json();
      pm.test("Response contains structured classes and terms schema", function () {
          pm.expect(jsonData.success).to.eql(true);
          pm.expect(jsonData.data).to.be.an('object');
          pm.expect(jsonData.data.classes).to.be.an('array');
          pm.expect(jsonData.meta).to.be.an('object');
          pm.expect(jsonData.meta.current_page).to.be.a('number');
      });

      if (jsonData.data && jsonData.data.classes.length > 0) {
          for (var i = 0; i < jsonData.data.classes.length; i++) {
              var c = jsonData.data.classes[i];
              if (c.terms && c.terms.length > 0) {
                  pm.environment.set("testClassTermId", c.terms[0].id);
                  pm.environment.set("testClassId", c.class_id);
                  break;
              }
          }
      }
    language: text/javascript
order: 1000
