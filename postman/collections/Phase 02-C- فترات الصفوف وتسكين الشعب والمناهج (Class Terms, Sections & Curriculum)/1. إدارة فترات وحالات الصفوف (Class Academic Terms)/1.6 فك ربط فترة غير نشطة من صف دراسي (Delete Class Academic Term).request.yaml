$kind: http-request
name: 1.6 فك ربط فترة غير نشطة من صف دراسي (Delete Class Academic Term)
description: |-
  إلغاء تخصيص فترة لصف دراسي بشرط ألا تكون الفترة النشطة حالياً للصف وألا تحتوي على مواد دراسية مسندة (ON DELETE RESTRICT).
url: "{{baseUrl}}/academic/class-academic-terms/{{testClassTermId}}"
method: DELETE
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{authToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 OK or 409 Conflict (RESTRICT)", function () {
          pm.expect([200, 404, 409]).to.include(pm.response.code);
      });

      if (pm.response.code === 200) {
          var jsonData = pm.response.json();
          pm.test("Response confirms class term removal", function () {
              pm.expect(jsonData.success).to.eql(true);
          });
      }
    language: text/javascript
order: 6000
