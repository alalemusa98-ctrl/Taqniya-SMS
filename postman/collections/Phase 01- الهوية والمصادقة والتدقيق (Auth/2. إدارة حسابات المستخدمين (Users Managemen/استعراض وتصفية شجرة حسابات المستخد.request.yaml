$kind: http-request
name: استعراض وتصفية شجرة حسابات المستخدمين (List Users Tree)
description: استعراض قائمة حسابات المستخدمين في شجرة هرمية مع إحصائيات الأدوار والترقيم والفرز.
url: "{{baseUrl}}/users?role_type=teacher&is_active=1&page=1&per_page=15&sort_by=created_at&sort_order=desc"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: role_type
    value: teacher
    description: "تصفية حسب الدور: admin, teacher, student, parent"
  - key: is_active
    value: "1"
    description: "الحالة: 1 مفعل، 0 معطل"
  - key: search
    value: ""
    disabled: true
    description: بحث بالرمز المؤسسي أو الاسم
  - key: page
    value: "1"
  - key: per_page
    value: "15"
  - key: sort_by
    value: created_at
    description: "الحقول المتاحة: id, user_code, last_login_at, created_at"
  - key: sort_order
    value: desc
    description: "الاتجاه: asc أو desc"
order: 1000
