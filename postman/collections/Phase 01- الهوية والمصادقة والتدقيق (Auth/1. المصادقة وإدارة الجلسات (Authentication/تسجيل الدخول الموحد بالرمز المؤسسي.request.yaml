$kind: http-request
name: تسجيل الدخول الموحد بالرمز المؤسسي (Login)
description: |-
  تسجيل الدخول الموحد لكافة مستخدمي المنظومة (مدير، معلم، طالب، ولي أمر) بالرمز المؤسسي وكلمة المرور.

  * ملاحظة: يخضع لحماية التخمين Rate Limiter بحد أقصى 5 طلبات في الدقيقة.
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: text
  content: |-
    {
      "user_code": "{{adminUserCode}}",
      "password": "{{adminPassword}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      if (pm.response.code === 200) {
          var jsonData = pm.response.json();
          pm.test("Login successful and token returned", function () {
              pm.expect(jsonData.success).to.eql(true);
              pm.expect(jsonData.data.token).to.be.a('string');
          });
          
          if (jsonData.data && jsonData.data.token) {
              pm.environment.set("authToken", jsonData.data.token);
              console.log("✅ تم حفظ authToken تلقائياً في متغيرات البيئة.");
          }
      }
    language: text/javascript
order: 1000
