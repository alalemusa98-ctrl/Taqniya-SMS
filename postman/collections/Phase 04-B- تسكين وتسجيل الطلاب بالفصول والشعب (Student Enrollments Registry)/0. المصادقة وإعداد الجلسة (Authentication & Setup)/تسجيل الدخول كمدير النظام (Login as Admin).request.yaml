$kind: http-request
name: تسجيل الدخول كمدير النظام (Login as Admin)
description: |-
  تسجيل دخول مدير النظام والحصول على التوكن وحفظه في متغير البيئة `authToken` لتمريره في جميع مسارات المرحلة 04-B.
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: text
  content: |-
    {
      "user_code": "{{adminUserCode}}",
      "password": "{{adminPassword}}"
    }
auth:
  type: noauth
responses:
  - name: 200 OK - تم تسجيل الدخول بنجاح
    status: OK
    code: 200
    headers:
      Content-Type: application/json
    body:
      success: true
      message: "تم تسجيل الدخول بنجاح."
      data:
        token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        user:
          id: 1
          user_code: "ADM-1001"
          role: "admin"
          full_name: "مدير النظام العام"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 - تم تسجيل الدخول بنجاح", function () {
          pm.response.to.have.status(200);
      });

      if (pm.response.code === 200) {
          var jsonData = pm.response.json();
          pm.test("Login response contains valid bearer token", function () {
              pm.expect(jsonData.success).to.eql(true);
              pm.expect(jsonData.data.token).to.be.a('string');
          });
          
          if (jsonData.data && jsonData.data.token) {
              pm.environment.set("authToken", jsonData.data.token);
              console.log("✅ تم حفظ authToken بنجاح لاختبارات المرحلة 04-B.");
          }
      }
    language: text/javascript
order: 1000
