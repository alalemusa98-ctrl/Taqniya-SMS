$kind: http-request
name: 1.4 تسكين وتسجيل طالب في صف وشعبة (Create Student Enrollment)
description: |-
  تسكين طالب في صف وشعبة بالعام الدراسي النشط وتوليد رقم الجلوس مع التحقق الذري من قيد منع تكرار التسكين السنوي (uq_student_year_enrollment) وفق routes.md.
url: "{{baseUrl}}/student-enrollments"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: text
  content: |-
    {
      "academic_year_id": {{yearId}},
      "student_id": {{studentId}},
      "class_section_id": 5,
      "seating_number": "SEAT-5003",
      "status": "enrolled"
    }
auth:
  type: bearer
  credentials:
    token: "{{authToken}}"
responses:
  - name: 201 Created - تم تسكين الطالب بنجاح
    status: Created
    code: 201
    headers:
      Content-Type: application/json
    body:
      success: true
      message: "تم تسكين وتنسيق الطالب بالفصل والشعبة بنجاح."
      data:
        id: 1
        academic_year_id: 1
        student_id: 3
        student_code: "STU-3003"
        student_name: "أنس خالد السويح"
        class_id: 5
        class_name: "الصف الخامس"
        grade_level: 5
        class_section_id: 5
        section_name: "شعبة أ"
        seating_number: "SEAT-5003"
        status: "enrolled"
        created_at: "2026-08-29T10:30:00Z"
  - name: 409 Conflict - تعارض التسكين السنوي مسبقاً
    status: Conflict
    code: 409
    headers:
      Content-Type: application/json
    body:
      success: false
      message: "تعارض في التسكين: الطالب مسكن مسبقاً في هذا العام الدراسي في فصل أو شعبة أخرى (uq_student_year_enrollment)."
  - name: 422 Unprocessable Entity - مدخلات غير صالحة
    status: Unprocessable Entity
    code: 422
    headers:
      Content-Type: application/json
    body:
      success: false
      message: "بيانات التسكين غير صالحة."
      errors:
        student_id:
          - "يجب تحديد طالب صالح."
        class_section_id:
          - "يجب تحديد شعبة دراسية صالحة."
  - name: 401 Unauthorized - غير مصرح بالوصول
    status: Unauthorized
    code: 401
    headers:
      Content-Type: application/json
    body:
      success: false
      message: "غير مصرح بالوصول. التوكن غير صالح أو منتهي الصلاحية."
  - name: 403 Forbidden - صلاحيات غير كافية
    status: Forbidden
    code: 403
    headers:
      Content-Type: application/json
    body:
      success: false
      message: "ليس لديك الصلاحية الكافية لتنفيذ هذا الإجراء."
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 201 Created or 409 Conflict (Duplicate)", function () {
          pm.expect([201, 409]).to.include(pm.response.code);
      });

      if (pm.response.code === 201) {
          var jsonData = pm.response.json();
          pm.test("Created enrollment contains valid id and student info", function () {
              pm.expect(jsonData.success).to.eql(true);
              pm.expect(jsonData.data.id).to.be.a('number');
              pm.expect(jsonData.data.status).to.eql('enrolled');
          });

          pm.environment.set("createdEnrollmentId", String(jsonData.data.id));
          pm.environment.set("enrollmentId", String(jsonData.data.id));
          console.log("✅ تم حفظ createdEnrollmentId:", jsonData.data.id);
      }
    language: text/javascript
order: 1400
