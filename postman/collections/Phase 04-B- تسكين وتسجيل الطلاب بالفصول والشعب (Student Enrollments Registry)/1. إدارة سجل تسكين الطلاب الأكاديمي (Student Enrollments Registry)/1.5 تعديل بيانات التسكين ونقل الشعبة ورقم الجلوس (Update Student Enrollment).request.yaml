$kind: http-request
name: 1.5 تعديل بيانات التسكين ونقل الشعبة ورقم الجلوس (Update Student Enrollment)
description: |-
  تعديل بيانات تسجيل الطالب ونقله لشعبة أخرى بنفس الصف، أو تحديث رقم الجلوس أو تعديل الحالة الأكاديمية وفق routes.md.
url: "{{baseUrl}}/student-enrollments/{{enrollmentId}}"
method: PUT
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: enrollmentId
    value: "{{enrollmentId}}"
    description: المعرف الرقمي الفريد لسجل التسكين المراد تعديله
body:
  type: text
  content: |-
    {
      "class_section_id": 6,
      "seating_number": "SEAT-5003-B",
      "status": "enrolled"
    }
auth:
  type: bearer
  credentials:
    token: "{{authToken}}"
responses:
  - name: 200 OK - تم تحديث بيانات التسكين بنجاح
    status: OK
    code: 200
    headers:
      Content-Type: application/json
    body:
      success: true
      message: "تم تحديث بيانات التسكين ورقم الجلوس بنجاح."
      data:
        id: 1
        class_section_id: 6
        section_name: "شعبة ب"
        seating_number: "SEAT-5003-B"
        status: "enrolled"
  - name: 404 Not Found - سجل التسكين غير موجود
    status: Not Found
    code: 404
    headers:
      Content-Type: application/json
    body:
      success: false
      message: "سجل التسكين غير موجود."
  - name: 422 Unprocessable Entity - شعبة غير صالحة
    status: Unprocessable Entity
    code: 422
    headers:
      Content-Type: application/json
    body:
      success: false
      message: "بيانات التسكين غير صالحة."
      errors:
        class_section_id:
          - "الشعبة الدراسية المحددة غير صالحة أو غير تابعة لنفس الصف الدراسي."
  - name: 401 Unauthorized - غير مصرح بالوصول
    status: Unauthorized
    code: 401
    headers:
      Content-Type: application/json
    body:
      success: false
      message: "غير مصرح بالوصول. التوكن غير صالح أو منتهي الصلاحية."
  - name: 403 Forbidden - صلاحيات غير كافية
    status: Forbidden
    code: 403
    headers:
      Content-Type: application/json
    body:
      success: false
      message: "ليس لديك الصلاحية الكافية لتنفيذ هذا الإجراء."
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 OK", function () {
          pm.response.to.have.status(200);
      });

      if (pm.response.code === 200) {
          var jsonData = pm.response.json();
          pm.test("Enrollment updated successfully", function () {
              pm.expect(jsonData.success).to.eql(true);
              pm.expect(jsonData.data.seating_number).to.eql("SEAT-5003-B");
          });
      }
    language: text/javascript
order: 1500
