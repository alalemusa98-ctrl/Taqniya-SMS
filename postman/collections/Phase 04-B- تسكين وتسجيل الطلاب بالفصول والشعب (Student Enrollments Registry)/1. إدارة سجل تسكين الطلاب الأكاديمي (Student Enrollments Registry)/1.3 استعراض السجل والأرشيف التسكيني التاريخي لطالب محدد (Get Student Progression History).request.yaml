$kind: http-request
name: 1.3 استعراض السجل والأرشيف التسكيني التاريخي لطالب محدد (Get Student Progression History)
description: |-
  استرجاع السجل التاريخي لتسكين طالب محدد عبر كافة الأعوام وتتبع تدرجه الأكاديمي وحالات النجاح والرسوب استناداً إلى الصحائف المؤرشفة والتسكين الجاري وفق routes.md.
url: "{{baseUrl}}/students/{{studentId}}/enrollments"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: studentId
    value: "{{studentId}}"
    description: المعرف الرقمي الفريد للطالب
auth:
  type: bearer
  credentials:
    token: "{{authToken}}"
responses:
  - name: 200 OK - تم جلب السجل التسكيني للطالب بنجاح
    status: OK
    code: 200
    headers:
      Content-Type: application/json
    body:
      success: true
      message: "تم جلب السجل التسكيني للطالب بنجاح."
      data:
        - id: 25
          academic_year_id: 2
          academic_year_name: "2025/2026"
          class_name: "الصف الخامس"
          grade_level: 5
          section_name: "شعبة أ"
          seating_number: "SEAT-5001"
          status: "enrolled"
          created_at: "2025-09-01T08:00:00Z"
        - id: 1
          academic_year_id: 1
          academic_year_name: "2024/2025"
          class_name: "الصف الرابع"
          grade_level: 4
          section_name: "شعبة ب"
          seating_number: "SEAT-4015"
          status: "passed"
          created_at: "2024-09-01T08:00:00Z"
  - name: 404 Not Found - سجل الطالب غير موجود
    status: Not Found
    code: 404
    headers:
      Content-Type: application/json
    body:
      success: false
      message: "سجل الطالب أو التسكين غير موجود."
  - name: 401 Unauthorized - غير مصرح بالوصول
    status: Unauthorized
    code: 401
    headers:
      Content-Type: application/json
    body:
      success: false
      message: "غير مصرح بالوصول. التوكن غير صالح أو منتهي الصلاحية."
  - name: 403 Forbidden - صلاحيات غير كافية
    status: Forbidden
    code: 403
    headers:
      Content-Type: application/json
    body:
      success: false
      message: "ليس لديك الصلاحية الكافية لتنفيذ هذا الإجراء."
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 - جلب السجل التسكيني بنجاح", function () {
          pm.response.to.have.status(200);
      });

      if (pm.response.code === 200) {
          var jsonData = pm.response.json();
          pm.test("Response data is progression history array", function () {
              pm.expect(jsonData.success).to.eql(true);
              pm.expect(jsonData.data).to.be.an('array');
          });
      }
    language: text/javascript
order: 1300
