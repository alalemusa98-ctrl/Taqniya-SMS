$kind: http-request
name: 3.3 تعديل رابط الوصاية وتبديل صفة الوصي الرئيسي (Update Guardian Student Link)
description: |-
  تعديل رابط الوصاية أو تغيير صفة الوصي الرئيسي وفق routes.md.
url: "{{baseUrl}}/guardian-students/{{guardianStudentLinkId}}"
method: PUT
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: text
  content: |-
    {
      "guardian_id": 1,
      "student_id": 2,
      "is_primary": 0
    }
auth:
  type: bearer
  credentials:
    token: "{{authToken}}"
responses:
  - name: 200 OK - تم تعديل رابط وصاية ولي الأمر بنجاح
    status: OK
    code: 200
    headers:
      Content-Type: application/json
    body:
      success: true
      message: "تم تعديل رابط وصاية ولي الأمر بنجاح."
      data:
        id: 15
        guardian_id: 1
        student_id: 2
        is_primary: 0
  - name: 404 Not Found - رابط الوصاية غير موجود
    status: Not Found
    code: 404
    headers:
      Content-Type: application/json
    body:
      success: false
      message: "سجل رابط الوصاية غير موجود."
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 or 404", function () {
          pm.expect([200, 404]).to.include(pm.response.code);
      });

      var jsonData = pm.response.json();
      if (pm.response.code === 200) {
          pm.test("Guardian custody updated successfully matching routes.md", function () {
              pm.expect(jsonData.success).to.eql(true);
          });
      }
    language: text/javascript
order: 3000
