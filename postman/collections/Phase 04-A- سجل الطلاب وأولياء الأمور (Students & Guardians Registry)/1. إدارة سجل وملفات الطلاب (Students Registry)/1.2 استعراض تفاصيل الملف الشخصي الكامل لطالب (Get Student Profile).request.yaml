$kind: http-request
name: 1.2 استعراض تفاصيل الملف الشخصي الكامل لطالب (Get Student Profile)
description: |-
  استرجاع الملف الشخصي الكامل للطالب متضمناً حساب دخوله الموحد والصف والشعبة وبيانات التواصل وفق routes.md.
url: "{{baseUrl}}/students/{{studentId}}"
method: GET
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{authToken}}"
responses:
  - name: 200 OK - تم جلب تفاصيل ملف الطالب بنجاح
    status: OK
    code: 200
    headers:
      Content-Type: application/json
    body:
      success: true
      message: "تم جلب تفاصيل ملف الطالب بنجاح."
      data:
        id: 1
        user_id: 101
        user_code: "STU-3001"
        full_name: "محمد علي الفيتوري"
        phone: "0911111111"
        birth_date: "2015-05-12"
        gender: "male"
        class_section: "الصف الخامس - شعبة أ"
        created_at: "2026-08-29T10:00:00Z"
  - name: 404 Not Found - ملف الطالب غير موجود
    status: Not Found
    code: 404
    headers:
      Content-Type: application/json
    body:
      success: false
      message: "ملف الطالب غير موجود."
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 or 404", function () {
          pm.expect([200, 404]).to.include(pm.response.code);
      });

      var jsonData = pm.response.json();
      if (pm.response.code === 200) {
          pm.test("Student profile matches routes.md schema", function () {
              pm.expect(jsonData.success).to.eql(true);
              pm.expect(jsonData.data.id).to.be.a('number');
              pm.expect(jsonData.data.user_code).to.be.a('string');
              pm.expect(jsonData.data.full_name).to.be.a('string');
          });
      }
    language: text/javascript
order: 2000
