$kind: http-request
name: 2.5 حذف ملف ولي الأمر مع فحص الحماية المرجعية (Delete Guardian)
description: |-
  حذف ملف ولي الأمر مع التحقق من عدم وجود وصاية نشطة على طلاب (RESTRICT) وفق routes.md.
url: "{{baseUrl}}/guardians/{{createdGuardianId}}"
method: DELETE
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{authToken}}"
responses:
  - name: 200 OK - تم حذف ملف ولي الأمر وحسابه بنجاح
    status: OK
    code: 200
    headers:
      Content-Type: application/json
    body:
      success: true
      message: "تم حذف ملف ولي الأمر وحسابه بنجاح."
  - name: 404 Not Found - ملف ولي الأمر غير موجود
    status: Not Found
    code: 404
    headers:
      Content-Type: application/json
    body:
      success: false
      message: "ملف ولي الأمر غير موجود."
  - name: 409 Conflict - حماية النزاهة المرجعية RESTRICT
    status: Conflict
    code: 409
    headers:
      Content-Type: application/json
    body:
      success: false
      message: "لا يمكن حذف ولي الأمر لارتباطه بروابط وصاية مع طلاب في المنظومة (Foreign Key Restrict)."
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200, 404, or 409", function () {
          pm.expect([200, 404, 409]).to.include(pm.response.code);
      });

      var jsonData = pm.response.json();
      if (pm.response.code === 200) {
          pm.test("Guardian deleted successfully", function () {
              pm.expect(jsonData.success).to.eql(true);
          });
      }
    language: text/javascript
order: 5000
