$kind: http-request
name: 2.3 تسجيل ولي أمر جديد وتوليد الحساب الموحد (Create Guardian)
description: |-
  إنشاء ملف ولي أمر وتوليد حساب مستخدم ذري بجدول users بكود PAR-XXXX مع التحقق من تفرد رقم الهاتف وفق routes.md.
url: "{{baseUrl}}/guardians"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: text
  content: |-
    {
      "full_name": "خالد مسعود السويح",
      "phone": "0913333333",
      "relationship": "father",
      "password": "Password123!"
    }
auth:
  type: bearer
  credentials:
    token: "{{authToken}}"
responses:
  - name: 201 Created - تم إنشاء ملف ولي الأمر وتوليد حساب الدخول بنجاح
    status: Created
    code: 201
    headers:
      Content-Type: application/json
    body:
      success: true
      message: "تم إنشاء ملف ولي الأمر وتوليد حساب الدخول بنجاح."
      data:
        id: 2
        user_id: 202
        user_code: "PAR-4002"
        full_name: "خالد مسعود السويح"
        phone: "0913333333"
        relationship: "father"
        created_at: "2026-08-29T12:00:00Z"
  - name: 409 Conflict - رقم الهاتف مسجل مسبقاً
    status: Conflict
    code: 409
    headers:
      Content-Type: application/json
    body:
      success: false
      message: "رقم هاتف ولي الأمر مسجل مسبقاً في المنظومة (uq_guardians_phone)."
  - name: 422 Unprocessable Entity - مدخلات غير صالحة
    status: Unprocessable Entity
    code: 422
    headers:
      Content-Type: application/json
    body:
      success: false
      message: "بيانات ولي الأمر غير صالحة."
      errors:
        phone:
          - "رقم الهاتف مطلوب."
        full_name:
          - "الاسم الكامل مطلوب."
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 201 or 409", function () {
          pm.expect([201, 409]).to.include(pm.response.code);
      });

      var jsonData = pm.response.json();
      if (pm.response.code === 201) {
          pm.test("Guardian created with atomic user code PAR-XXXX matching routes.md", function () {
              pm.expect(jsonData.success).to.eql(true);
              pm.expect(jsonData.data.id).to.be.a('number');
              pm.expect(jsonData.data.user_code).to.match(/^PAR-\d+$/);
          });

          if (jsonData.data && jsonData.data.id) {
              pm.environment.set("createdGuardianId", String(jsonData.data.id));
              console.log("✅ تم حفظ createdGuardianId بنجاح:", jsonData.data.id);
          }
      } else if (pm.response.code === 409) {
          pm.test("Conflict on duplicate phone caught properly", function () {
              pm.expect(jsonData.success).to.eql(false);
          });
      }
    language: text/javascript
order: 3000
