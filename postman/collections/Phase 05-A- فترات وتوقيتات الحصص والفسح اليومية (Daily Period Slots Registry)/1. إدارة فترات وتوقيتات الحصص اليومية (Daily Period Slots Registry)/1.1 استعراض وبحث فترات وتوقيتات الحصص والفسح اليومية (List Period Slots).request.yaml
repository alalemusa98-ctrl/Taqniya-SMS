$kind: http-request
name: 1.1 استعراض وبحث فترات وتوقيتات الحصص والفسح اليومية (List Period Slots)
description: |-
  استرجاع قائمة الفترات الزمنية للحصص والفسح باليوم المدرسي مرتبة تسلسلياً بحسب `slot_number` مع دعم الفلترة بحالة الاستراحة والبحث والترقيم الصفحي وفق routes.md.
url: "{{baseUrl}}/period-slots?search=&is_break=&sort_by=slot_number&sort_order=asc&page=1&per_page=15"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: search
    value: ""
    disabled: true
    description: "البحث النصي بمسمى الحصة (مثال: الحصة الأولى أو الفسحة)"
  - key: is_break
    value: ""
    disabled: true
    description: "تصفية بحسب نوع الفترة: 0 للحصص التعليمية، 1 لفترات الاستراحة"
  - key: sort_by
    value: slot_number
    disabled: true
    description: "حقل الفرز والترتيب: id, slot_number, start_time"
  - key: sort_order
    value: asc
    disabled: true
    description: "اتجاه الفرز: asc, desc"
  - key: page
    value: "1"
    disabled: true
    description: رقم الصفحة الحالية
  - key: per_page
    value: "15"
    disabled: true
    description: عدد السجلات في الصفحة الواحدة
auth:
  type: bearer
  credentials:
    token: "{{authToken}}"
responses:
  - name: 200 OK - تم جلب فترات الحصص اليومية بنجاح
    status: OK
    code: 200
    headers:
      Content-Type: application/json
    body:
      success: true
      message: "تم جلب فترات الحصص اليومية بنجاح."
      data:
        - id: 1
          name: "الحصة الأولى"
          slot_number: 1
          start_time: "08:00:00"
          end_time: "08:45:00"
          is_break: 0
          created_at: "2026-08-29T08:00:00Z"
        - id: 2
          name: "الحصة الثانية"
          slot_number: 2
          start_time: "08:45:00"
          end_time: "09:30:00"
          is_break: 0
          created_at: "2026-08-29T08:00:00Z"
        - id: 3
          name: "الفسحة / الاستراحة"
          slot_number: 3
          start_time: "09:30:00"
          end_time: "10:00:00"
          is_break: 1
          created_at: "2026-08-29T08:00:00Z"
      meta:
        current_page: 1
        per_page: 15
        total: 3
        last_page: 1
  - name: 200 OK - القائمة فارغة
    status: OK
    code: 200
    headers:
      Content-Type: application/json
    body:
      success: true
      message: "لا توجد فترات حصص تطابق محددات البحث."
      data: []
      meta:
        current_page: 1
        per_page: 15
        total: 0
        last_page: 1
  - name: 401 Unauthorized - غير مصرح بالوصول
    status: Unauthorized
    code: 401
    headers:
      Content-Type: application/json
    body:
      success: false
      message: "غير مصرح بالوصول. التوكن غير صالح أو منتهي الصلاحية."
  - name: 403 Forbidden - صلاحيات غير كافية
    status: Forbidden
    code: 403
    headers:
      Content-Type: application/json
    body:
      success: false
      message: "ليس لديك الصلاحية الكافية لتنفيذ هذا الإجراء."
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 - تم جلب فترات الحصص بنجاح", function () {
          pm.response.to.have.status(200);
      });

      if (pm.response.code === 200) {
          var jsonData = pm.response.json();
          pm.test("Response contains period slots data array and meta pagination", function () {
              pm.expect(jsonData.success).to.eql(true);
              pm.expect(jsonData.data).to.be.an('array');
              pm.expect(jsonData.meta).to.be.an('object');
          });

          // Save first periodSlot ID if available for subsequent tests
          if (jsonData.data && jsonData.data.length > 0) {
              var firstSlot = jsonData.data[0];
              pm.environment.set("periodSlotId", String(firstSlot.id));
              console.log("✅ تم حفظ periodSlotId:", firstSlot.id);
          }
      }
    language: text/javascript
order: 1100
