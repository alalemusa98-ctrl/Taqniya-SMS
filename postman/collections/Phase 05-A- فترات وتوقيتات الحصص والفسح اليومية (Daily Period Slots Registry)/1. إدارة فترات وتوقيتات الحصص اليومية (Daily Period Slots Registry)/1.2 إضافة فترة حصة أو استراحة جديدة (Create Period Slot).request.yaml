$kind: http-request
name: 1.2 إضافة فترة حصة أو استراحة جديدة (Create Period Slot)
description: |-
  إضافة فترة حصة أو استراحة جديدة باليوم المدرسي مع فحص تفرد الرقم التسلسلي للحصة (`uq_period_slots_number`) وأسبقية وقت البداية على النهاية وفق routes.md.
url: "{{baseUrl}}/period-slots"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: text
  content: |-
    {
      "name": "الحصة السادسة التجريبية",
      "slot_number": 99,
      "start_time": "13:00:00",
      "end_time": "13:45:00",
      "is_break": 0
    }
auth:
  type: bearer
  credentials:
    token: "{{authToken}}"
responses:
  - name: 201 Created - تم إنشاء فترة الحصة اليومية بنجاح
    status: Created
    code: 201
    headers:
      Content-Type: application/json
    body:
      success: true
      message: "تم إنشاء فترة الحصة اليومية بنجاح."
      data:
        id: 99
        name: "الحصة السادسة التجريبية"
        slot_number: 99
        start_time: "13:00:00"
        end_time: "13:45:00"
        is_break: 0
        created_at: "2026-08-29T13:00:00Z"
  - name: 401 Unauthorized - غير مصرح بالوصول
    status: Unauthorized
    code: 401
    headers:
      Content-Type: application/json
    body:
      success: false
      message: "غير مصرح بالوصول. التوكن غير صالح أو منتهي الصلاحية."
  - name: 403 Forbidden - صلاحيات غير كافية
    status: Forbidden
    code: 403
    headers:
      Content-Type: application/json
    body:
      success: false
      message: "ليس لديك الصلاحية الكافية لتنفيذ هذا الإجراء."
  - name: 409 Conflict - الرقم التسلسلي مسجل مسبقاً
    status: Conflict
    code: 409
    headers:
      Content-Type: application/json
    body:
      success: false
      message: "الرقم التسلسلي للحصة مسجل مسبقاً (uq_period_slots_number)."
  - name: 422 Unprocessable Entity - بيانات غير صالحة
    status: Unprocessable Entity
    code: 422
    headers:
      Content-Type: application/json
    body:
      success: false
      message: "بيانات فترة الحصة غير صالحة."
      errors:
        end_time:
          - "وقت النهاية يجب أن يكون لاحقاً لوقت البداية."
        slot_number:
          - "الرقم التسلسلي للحصة مطلوب ويجب أن يكون رقماً صحيحاً موجباً."
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 201 - تم إنشاء فترة الحصة بنجاح", function () {
          pm.response.to.have.status(201);
      });

      if (pm.response.code === 201) {
          var jsonData = pm.response.json();
          pm.test("Response contains newly created slot data with ID", function () {
              pm.expect(jsonData.success).to.eql(true);
              pm.expect(jsonData.data).to.be.an('object');
              pm.expect(jsonData.data.id).to.be.a('number');
          });

          if (jsonData.data && jsonData.data.id) {
              pm.environment.set("createdPeriodSlotId", String(jsonData.data.id));
              console.log("✅ تم حفظ createdPeriodSlotId بنجاح للاختبارات التالية:", jsonData.data.id);
          }
      }
    language: text/javascript
order: 1200
