$kind: http-request
name: 1.4 حذف فترة الحصة مع فحص الحماية المرجعية (Delete Period Slot)
description: |-
  حذف فترة الحصة المنشأة في الاختبار السابق بالمعرف `createdPeriodSlotId` ناعماً (Soft Delete) مع التحقق الإجباري من عدم استخدامها في أي جدول حصص أسبوعي نشط (Foreign Key Restrict) وفق routes.md.
url: "{{baseUrl}}/period-slots/{{createdPeriodSlotId}}"
method: DELETE
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{authToken}}"
responses:
  - name: 200 OK - تم حذف فترة الحصة بنجاح
    status: OK
    code: 200
    headers:
      Content-Type: application/json
    body:
      success: true
      message: "تم حذف فترة الحصة بنجاح."
  - name: 401 Unauthorized - غير مصرح بالوصول
    status: Unauthorized
    code: 401
    headers:
      Content-Type: application/json
    body:
      success: false
      message: "غير مصرح بالوصول. التوكن غير صالح أو منتهي الصلاحية."
  - name: 403 Forbidden - صلاحيات غير كافية
    status: Forbidden
    code: 403
    headers:
      Content-Type: application/json
    body:
      success: false
      message: "ليس لديك الصلاحية الكافية لتنفيذ هذا الإجراء."
  - name: 404 Not Found - فترة الحصة غير موجودة
    status: Not Found
    code: 404
    headers:
      Content-Type: application/json
    body:
      success: false
      message: "فترة الحصة غير موجودة."
  - name: 409 Conflict - حماية النزاهة المرجعية
    status: Conflict
    code: 409
    headers:
      Content-Type: application/json
    body:
      success: false
      message: "لا يمكن حذف فترة الحصة لارتباطها بحصص مجدولة في الجداول الأسبوعية (Foreign Key Restrict)."
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 - تم حذف فترة الحصة بنجاح", function () {
          pm.response.to.have.status(200);
      });

      if (pm.response.code === 200) {
          var jsonData = pm.response.json();
          pm.test("Response confirms slot deletion", function () {
              pm.expect(jsonData.success).to.eql(true);
              pm.expect(jsonData.message).to.eql("تم حذف فترة الحصة بنجاح.");
          });

          // Reset temporary slot variable
          pm.environment.set("createdPeriodSlotId", "");
          console.log("✅ تم تفريغ createdPeriodSlotId بنجاح بعد اكتمال دورة الاختبار الحيوية.");
      }
    language: text/javascript
order: 1400
