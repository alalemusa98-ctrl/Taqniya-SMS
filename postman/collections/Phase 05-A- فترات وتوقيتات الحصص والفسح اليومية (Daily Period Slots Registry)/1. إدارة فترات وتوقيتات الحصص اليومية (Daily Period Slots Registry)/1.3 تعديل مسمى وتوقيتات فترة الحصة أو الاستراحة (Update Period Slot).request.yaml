$kind: http-request
name: 1.3 تعديل مسمى وتوقيتات فترة الحصة أو الاستراحة (Update Period Slot)
description: |-
  تحديث مسمى وتوقيتات ونوع فترة الحصة اليومية المنشأة في الاختبار السابق، مع فحص وجود الحصة وصحة التوقيتات وتفرد التسلسل وفق routes.md.
url: "{{baseUrl}}/period-slots/{{createdPeriodSlotId}}"
method: PUT
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: text
  content: |-
    {
      "name": "الحصة السادسة المعدلة",
      "slot_number": 99,
      "start_time": "13:00:00",
      "end_time": "13:50:00",
      "is_break": 0
    }
auth:
  type: bearer
  credentials:
    token: "{{authToken}}"
responses:
  - name: 200 OK - تم تحديث فترة الحصة اليومية بنجاح
    status: OK
    code: 200
    headers:
      Content-Type: application/json
    body:
      success: true
      message: "تم تحديث فترة الحصة اليومية بنجاح."
      data:
        id: 99
        name: "الحصة السادسة المعدلة"
        slot_number: 99
        start_time: "13:00:00"
        end_time: "13:50:00"
        is_break: 0
  - name: 401 Unauthorized - غير مصرح بالوصول
    status: Unauthorized
    code: 401
    headers:
      Content-Type: application/json
    body:
      success: false
      message: "غير مصرح بالوصول. التوكن غير صالح أو منتهي الصلاحية."
  - name: 403 Forbidden - صلاحيات غير كافية
    status: Forbidden
    code: 403
    headers:
      Content-Type: application/json
    body:
      success: false
      message: "ليس لديك الصلاحية الكافية لتنفيذ هذا الإجراء."
  - name: 404 Not Found - فترة الحصة غير موجودة
    status: Not Found
    code: 404
    headers:
      Content-Type: application/json
    body:
      success: false
      message: "فترة الحصة غير موجودة."
  - name: 409 Conflict - تعارض في الرقم التسلسلي
    status: Conflict
    code: 409
    headers:
      Content-Type: application/json
    body:
      success: false
      message: "الرقم التسلسلي للحصة مسجل مسبقاً (uq_period_slots_number)."
  - name: 422 Unprocessable Entity - بيانات غير صالحة
    status: Unprocessable Entity
    code: 422
    headers:
      Content-Type: application/json
    body:
      success: false
      message: "بيانات فترة الحصة غير صالحة."
      errors:
        end_time:
          - "وقت النهاية يجب أن يكون لاحقاً لوقت البداية."
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 - تم تحديث فترة الحصة بنجاح", function () {
          pm.response.to.have.status(200);
      });

      if (pm.response.code === 200) {
          var jsonData = pm.response.json();
          pm.test("Response indicates update success and contains updated attributes", function () {
              pm.expect(jsonData.success).to.eql(true);
              pm.expect(jsonData.data.name).to.eql("الحصة السادسة المعدلة");
          });
      }
    language: text/javascript
order: 1300
