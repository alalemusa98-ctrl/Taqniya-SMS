# ==============================================================================
# TAQNIYA STACK CONFIGURATION (stack.yaml)
# ==============================================================================
# الإعلان الرسمي لتقنيات وأدوات مشروع: نظام إدارة المدارس (Taqniya-SMS)
# عبر 13 بُعداً معمارياً مستقلاً وفق معايير Taqniya Framework
# ==============================================================================

project:
  name: "Taqniya School Management System (Taqniya-SMS)"
  description: "نظام متكامل وشامل لإدارة العمليات المدرسية والأكاديمية والمالية والإدارية"
  type: "web"
  repository: "https://github.com/ofifice-alalem/Taqniya-SMS"

architecture:
  pattern: "Layered" # Clean Layered (Controllers -> Services -> Repositories)
  communication:
    mode: "api_first" # direct | api_first | hybrid
    direct:
      enabled: false
      style: "None"
    api:
      enabled: true
      style: "rest"
      documentation: "OpenAPI 3.1 / Swagger"
    consumers:
      - "web"
      - "mobile"
      - "parent_portal"
      - "teacher_portal"

frontend:
  name: "Vue.js"
  version: "3.4.x"
  language: "JavaScript / TypeScript"
  package_manager: "npm"

styling:
  name: "Tailwind CSS"
  version: "3.4.x"

state:
  name: "Pinia"
  version: "2.1.x"

backend:
  name: "NestJS"
  version: "10.x"
  language: "TypeScript"
  package_manager: "npm"

database:
  name: "MySQL"
  version: "8.0.x"
  orm_or_query_builder: "Prisma / mysql2"
  migration_tool: "Prisma Migrate / Knex"
  primary_key_strategy: "BigInt Auto-increment"

cache:
  name: "Redis"
  version: "7.x"

api:
  name: "REST"
  style: "RESTful JSON"
  documentation: "OpenAPI 3.1 / Swagger"

authentication:
  name: "JWT"
  strategy: "Stateless Bearer Tokens (Access + Refresh Tokens)"
  rbac: "Role-Based Access Control (Admin, Teacher, Student, Parent, Accountant)"

testing:
  name: "Vitest / Supertest"
  unit_runner: "Vitest"
  integration_runner: "Supertest"
  e2e_runner: "Playwright"
  mocking: "Vitest Built-in"

build:
  name: "Vite"
  bundler: "Vite"
  transpiler: "ESBuild / TypeScript"

deployment:
  name: "Docker"
  platform: "Docker Compose / Cloud VPS"
  container_runtime: "Docker"
  ci_cd: "GitHub Actions"

infrastructure:
  name: "Self-Hosted"
  provider: "Docker Containerized"
